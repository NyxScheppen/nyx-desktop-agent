name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.12.18"

jobs:
  backend-quality:
    name: Backend quality
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ runner.temp }}\uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==$env:UV_VERSION"
      - name: Cache Python packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run --no-sync python -m ruff check nyx/ tests/ scripts/
      - name: Pyright
        run: uv run --no-sync python -m pyright nyx/ tests/ scripts/
      - name: Pytest with coverage
        run: >-
          uv run --no-sync python -m pytest -q
          --cov=nyx --cov-report=term-missing --cov-fail-under=90

  frontend-desktop-quality:
    name: Frontend and desktop quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d7c243d3c7655b2b300b45e7cbe # v4.0.3
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust
        run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            frontend\src-tauri\target
          key: cargo-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Rust check
        working-directory: frontend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  package-windows:
    name: Package Windows release
    if: github.event_name != 'pull_request'
    needs: [backend-quality, frontend-desktop-quality]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      HF_HOME: ${{ runner.temp }}\huggingface
      UV_CACHE_DIR: ${{ runner.temp }}\uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d7c243d3c7655b2b300b45e7cbe # v4.0.3
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust
        run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install uv
        run: python -m pip install "uv==$env:UV_VERSION"
      - name: Cache build dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            ${{ env.HF_HOME }}
            ~\.cargo\registry
            ~\.cargo\git
            frontend\src-tauri\target
          key: package-${{ runner.os }}-${{ hashFiles('uv.lock', 'frontend/package-lock.json', 'frontend/src-tauri/Cargo.lock') }}
      - name: Install locked build dependencies
        run: uv sync --locked --extra desktop-build
      - name: Validate version sources
        run: uv run --no-sync python scripts/check_release_version.py
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --no-sync python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - name: Build frozen backend
        run: uv run --no-sync python dev.py --build-sidecar
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Tauri installers
        working-directory: frontend
        run: npm run tauri build
      - name: Smoke-test release sidecar
        run: uv run --no-sync python scripts/smoke_release.py
      - name: Stage release assets
        run: |
          $stage = Join-Path $PWD "artifacts\release"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem "frontend\src-tauri\target\release\bundle\nsis" -Filter "*.exe" |
            Copy-Item -Destination $stage
          Get-ChildItem "frontend\src-tauri\target\release\bundle\msi" -Filter "*.msi" |
            Copy-Item -Destination $stage
          $lines = Get-ChildItem $stage -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $stage "SHA256SUMS.txt"),
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyx-windows-diagnostics-${{ github.run_id }}
          path: artifacts/backend.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyx-windows-${{ github.run_id }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-windows]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nyx-windows-${{ github.run_id }}
          path: artifacts/release
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem "artifacts\release" -File |
            ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets `
            --verify-tag `
            --draft `
            --generate-notes `
            --title "Nyx $env:GITHUB_REF_NAME" `
            --notes "Windows x64 preview. Installers are not code-signed yet; verify SHA256SUMS.txt before installation."
