      .arrow-blue { fill: none; stroke: #3f6faf; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #36804b; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .arrow-purple { fill: none; stroke: #7650a3; stroke-width: 2.2; marker-end: url(#arrow-purple); }
      .arrow-red { fill: none; stroke: #b53b3b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
