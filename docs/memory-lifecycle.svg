<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Nyx 记忆与事实生命周期</title>
  <desc id="desc">展示记忆生成入口、统一持久化、去重强化、短期转长期、事实更新、矛盾反思和错误落点。</desc>
  <defs>
    <style>
      .title { font: 700 32px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17233c; }
      .subtitle { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #526070; }
      .section { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17233c; }
      .label { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17233c; }
      .body { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #263343; }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #526070; }
      .white { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #ccd3dc; stroke-width: 1.5; rx: 8; }
      .source { fill: #eef4ff; stroke: #4d75b8; stroke-width: 1.5; rx: 6; }
      .process { fill: #edf8f7; stroke: #2b7c78; stroke-width: 1.5; rx: 6; }
      .short { fill: #fff7df; stroke: #b27a13; stroke-width: 1.5; rx: 6; }
      .long { fill: #edf8ef; stroke: #36804b; stroke-width: 1.5; rx: 6; }
      .fact { fill: #f4effb; stroke: #7650a3; stroke-width: 1.5; rx: 6; }
      .error { fill: #fff0f0; stroke: #b53b3b; stroke-width: 1.8; rx: 6; }
