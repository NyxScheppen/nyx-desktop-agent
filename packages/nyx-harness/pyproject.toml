[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-harness"
version = "0.1.0"
description = "Small plugin assembly harness for Nyx-compatible agents"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
nyx_harness = ["py.typed"]
