[project]
name = "nyx-agent"
version = "0.1.0"
description = "Nyx — 桌面陪伴 AI"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "aiosqlite>=0.20.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "langchain-core==1.5.5",
    "langchain-openai==1.5.1",
    "langgraph==1.2.11",
    "lxml>=4.9",
    "networkx==3.6.1",
    "pillow>=10.0.0",
    "rapidocr_onnxruntime==1.4.4",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "sentence-transformers==5.6.0",
    "trafilatura>=2.0.0",
    "uvicorn==0.34.0",
    "watchfiles>=0.13",
]

[project.optional-dependencies]
desktop-build = ["pyinstaller==6.19.0"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.11"
exclude = ["build", "frontend/src-tauri/target", "**/node_modules", "**/__pycache__", ".venv", ".runtime", ".claude"]
typeCheckingMode = "strict"
reportUnusedFunction = true
reportUnusedClass = true

[tool.setuptools.packages.find]
include = ["nyx*"]
