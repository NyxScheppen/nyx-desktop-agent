[project]
name = "nyx-agent"
version = "0.1.0"
description = "Nyx — 桌面陪伴 AI"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "aiosqlite>=0.20.0",
    "duckduckgo_search==8.1.1",
    "langchain-core==1.5.5",
    "langchain-openai==1.5.1",
    "pydantic>=2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
