[project]
name = "nyx-agent"
version = "0.1.0"
description = "Nyx — 桌面陪伴 AI"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "aiosqlite>=0.20.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "langchain-core==1.5.5",
    "langchain-openai==1.5.1",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.2.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "lxml>=4.9",
    "networkx==3.6.1",
    "nyx-harness",
    "pillow>=10.0.0",
    "playwright>=1.57,<2",
    "psycopg[binary]==3.3.6",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "sentence-transformers==5.6.0",
    "trafilatura>=2.0.0",
    "uvicorn==0.34.0",
    "watchfiles>=0.13",
    "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
]
desktop-build = ["pyinstaller==6.19.0"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["scripts/e2e"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["nyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/nyx-harness"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["packages/nyx-harness"]
exclude = ["build", "frontend/src-tauri/target", "**/node_modules", "**/__pycache__", ".venv", ".runtime", ".claude", "scripts/e2e/**"]
typeCheckingMode = "strict"
reportUnusedFunction = true
reportUnusedClass = true

[tool.setuptools.packages.find]
include = ["nyx*"]

[tool.setuptools.package-data]
nyx = ["prompts/*.md", "prompts/skills/*.json", "cards/nyx/*.yaml", "cards/nyx/*.md", "cards/nyx/assets/*"]

[tool.uv.workspace]
members = [
    "packages/nyx-harness",
]

[tool.uv.sources]
nyx-harness = { workspace = true, editable = true }
